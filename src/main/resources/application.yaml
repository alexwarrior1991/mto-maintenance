spring:
  application:
    name: mto-maintenance
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:dev}
  # La API es un resource server: no emite tokens ni guarda usuarios, solo valida los que emite
  # Keycloak. El JWK Set se descarga de forma perezosa, con lo que un Keycloak que aun no responde
  # no impide arrancar.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}

      # Cliente para las llamadas SALIENTES a mto-stock, que se autentica contra este mismo
      # Keycloak. Mismo patron que mto-configuration.
      client:
        provider:
          keycloak:
            # Se declara el endpoint de token en lugar de issuer-uri a proposito: el descubrimiento
            # por issuer es una llamada HTTP durante la creacion del bean, y con ella la aplicacion
            # no arrancaria si Keycloak no esta listo todavia.
            token-uri: ${KEYCLOAK_TOKEN_URI:http://auth.mto.local:8082/realms/mto/protocol/openid-connect/token}
        registration:
          # Cuenta de servicio de esta aplicacion. client_credentials y no password: el token
          # representa al servicio, no a una persona, y asi la auditoria de mto-stock no atribuye a
          # un usuario lo que hizo un proceso.
          mto-services:
            provider: keycloak
            client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:mto-maintenance-svc}
            # Vacio por defecto: con app.stock.enabled=false nadie pide un token y la aplicacion
            # arranca sin secreto. Con stock activo y sin secreto, la primera llamada falla y la
            # linea de material queda marcada FAILED, que es lo que se quiere ver.
            client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic

  # Historial de cambios (Hibernate Envers). Vive aqui y no en los application-*.yml porque no
  # cambia por perfil; las propiedades de hibernate se acumulan entre ficheros, asi que esto convive
  # con el format_sql que anade el perfil dev.
  jpa:
    properties:
      org.hibernate.envers:
        # En minusculas a proposito. El sufijo por defecto es _AUD y el nombre final depende de como
        # trate la estrategia de nombres a los identificadores de Envers; fijarlo aqui hace que la
        # tabla se llame igual pase lo que pase. Equivocarse en esto no da un aviso: con
        # ddl-auto: validate la aplicacion no arranca.
        audit_table_suffix: _aud
        revision_field_name: rev
        revision_type_field_name: revtype
        # Guarda el ultimo estado conocido en la fila de borrado. Sin esto un DEL deja solo el id y
        # nulos, y la pregunta que motiva todo esto -que decia la tarea que alguien quito- habria
        # que contestarla yendo a buscar la revision anterior.
        store_data_at_delete: true

  # Este servicio solo CONSUME: no publica nada, asi que no hay publisher confirms ni returns que
  # configurar. Lo que hay debajo de listener.simple lo aplica Spring Boot a traves del
  # SimpleRabbitListenerContainerFactoryConfigurer; sin pasar por el, una factory declarada a mano
  # descarta todo este bloque en silencio (ver RabbitMqConfiguration).
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        # El contenedor confirma el mensaje al volver el listener sin excepcion, y lo rechaza si
        # lanza. No hay ack manual porque no hay nada que confirmar a medias: el listener delega en
        # un unico manejador y no reparte el trabajo entre hilos.
        acknowledge-mode: auto
        # Continua la traza que viaja en las cabeceras del mensaje. mto-configuration escribe
        # traceparent/tracestate al publicar desde el outbox; sin esto, consumir abria una traza
        # nueva y el salto por la cola quedaba como un corte en el medio.
        observation-enabled: ${SPRING_RABBITMQ_LISTENER_OBSERVATION_ENABLED:true}
        concurrency: ${SPRING_RABBITMQ_LISTENER_CONCURRENCY:1}
        max-concurrency: ${SPRING_RABBITMQ_LISTENER_MAX_CONCURRENCY:5}
        prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:10}
        retry:
          # Reintentos acotados: agotados los intentos, el mensaje va a la DLQ. La otra mitad de
          # esa garantia -no reencolar lo rechazado- la fija el codigo y no este bloque, porque un
          # reencolado infinito atasca el canal entero. Ver RabbitMqConfiguration.
          enabled: true
          max-retries: ${SPRING_RABBITMQ_LISTENER_MAX_RETRIES:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  # Timeouts del RestClient que habla con mto-stock. Claves en plural de Boot 4.1.
  http:
    clients:
      connect-timeout: ${APP_STOCK_CONNECT_TIMEOUT:2s}
      read-timeout: ${APP_STOCK_READ_TIMEOUT:10s}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  health:
    # Fuera del health: un broker caido deja de aplicar cambios de datos maestros, pero la API
    # sigue sirviendo. Contarlo como DOWN sacaria la instancia del balanceador por algo de lo que se
    # recupera sola.
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
    # Los circuitos (el de mto-stock) entran como componente informativo, no deciden el global.
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

  # Trazabilidad distribuida. Mismos valores que el resto de servicios, a proposito.
  tracing:
    enabled: ${MTO_TRACING_ENABLED:true}
    sampling:
      # Muestrear el 100% en un servicio con trafico real es caro y casi nunca hace falta. Un span
      # NO muestreado sigue propagando su traceparent (con el flag a 00), asi que la cadena entre
      # servicios no se rompe por muestrear poco.
      probability: ${MTO_TRACING_SAMPLING_PROBABILITY:0.1}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        # Las metricas salen por Prometheus (ver /actuator/prometheus). El starter de OpenTelemetry
        # arrastra tambien un registro OTLP de metricas, y sin esto intentaria empujarlas a un
        # colector ademas de exponerlas.
        enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Catenary (OCS) maintenance API
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    disable-swagger-default-url: true
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}

app:
  security:
    # Cliente de Keycloak que representa a esta API. Sus roles de cliente son los permisos que
    # comprueban la cadena de filtros y las anotaciones de seguridad de metodo.
    client-id: ${KEYCLOAK_CLIENT_ID:mto-maintenance-api}
    # Claim que se usa como nombre del principal, y por tanto como autor en las columnas de auditoria.
    principal-claim: preferred_username
    audience-validation-enabled: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:true}
    # Si la validacion de audiencia esta activa y este valor llega vacio, la aplicacion no arranca:
    # sin audiencia la API aceptaria cualquier token emitido por el realm, incluido el del frontal
    # de otra aplicacion.
    required-audience: ${KEYCLOAK_AUDIENCE:mto-maintenance-api}
    # Publicar /swagger-ui y /v3/api-docs sin autenticacion. Cerrado por defecto para que un entorno
    # desplegado nuevo no exponga el catalogo completo de endpoints por olvido: los perfiles de
    # desarrollo lo abren explicitamente.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
    cors:
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Correlation-Id
      exposed-headers:
        - Location
        - X-Correlation-Id
      allow-credentials: false
      max-age: ${APP_CORS_MAX_AGE:3600}

  # Canal de eventos de datos maestros publicados por mto-configuration.
  #
  # El exchange y la routing key son contrato del emisor y no se cambian por gusto: un binding
  # contra un exchange que nadie usa se declara igual de bien y deja de llegar todo sin ningun
  # error visible. La cola y su DLQ si son de este servicio, que es quien las consume.
  #
  # De las ocho entidades publicadas, cuatro tienen logica detras (profile, disconnector,
  # section-insulator y track); el resto se registra y se ignora. Ver MasterDataEntityHandler.
  rabbitmq:
    # Apaga la declaracion de la topologia Y el consumidor. Con esto en false nadie abre una
    # conexion, asi que la aplicacion arranca sin broker.
    enabled: ${APP_RABBITMQ_ENABLED:true}
    master-data:
      exchange: ${APP_RABBITMQ_MASTER_DATA_EXCHANGE:mto.master-data.exchange}
      queue: ${APP_RABBITMQ_MASTER_DATA_QUEUE:mto.maintenance.master-data.queue}
      routing-key: "${APP_RABBITMQ_MASTER_DATA_ROUTING_KEY:mto.master-data.#}"
      dead-letter-exchange: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_EXCHANGE:mto.maintenance.master-data.queue.dlx}
      dead-letter-queue: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_QUEUE:mto.maintenance.master-data.queue.dlq}
      dead-letter-routing-key: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_ROUTING_KEY:mto.maintenance.master-data.queue.dlq}
      # Permite declarar la topologia sin consumir: util para dejar la cola creada acumulando
      # eventos mientras el servicio todavia no sabe que hacer con ellos.
      listener-enabled: ${APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED:true}

  # Firma de los mensajes, sobre los bytes que viajan de verdad. Es la unica comprobacion de
  # integridad que un consumidor puede rehacer: el messageHash del payload se calcula sobre el objeto
  # antes de serializarlo y no sobrevive a la ida y vuelta.
  messaging:
    signature:
      # EL MISMO VALOR que app.messaging.signature.secret en mto-configuration. Con secreto la firma
      # es HMAC-SHA256 y protege de manipulacion; sin el se degrada a un SHA-256 simple, que detecta
      # corrupcion pero no manipulacion, porque quien altere el mensaje puede recalcularlo.
      secret: ${MESSAGING_SIGNATURE_SECRET:}
      # DISABLED no comprueba nada; OPTIONAL rechaza una firma que no cuadra pero acepta lo que no
      # puede comprobar; REQUIRED exige que todo mensaje llegue firmado y sea comprobable.
      #
      # Por defecto OPTIONAL y no REQUIRED a proposito: si los dos servicios no comparten todavia el
      # mismo secreto, el emisor firma con HMAC, aqui solo se sabe calcular SHA-256 y REQUIRED
      # mandaria a la DLQ todos los mensajes validos.
      mode: ${MESSAGING_SIGNATURE_MODE:OPTIONAL}

  # Integracion con mto-stock: reserva de materiales al planificar una orden, consumo al
  # completarla y liberacion al cancelarla.
  stock:
    # Con esto en false el cliente es un NoOp que solo registra lo que habria hecho, y la aplicacion
    # arranca sin mto-stock ni cuenta de servicio. Es lo que usan los tests.
    enabled: ${APP_STOCK_ENABLED:true}
    # En local mto-stock escucha en el 8080; en compose se llega por el nombre del servicio.
    base-url: ${MTO_STOCK_URL:http://localhost:8080}
    # Registro de spring.security.oauth2.client con el que se pide el token de la cuenta de servicio.
    client-registration-id: mto-services
    # Aislamiento de fallos: con el circuito abierto las llamadas fallan al instante y la linea de
    # material queda en FAILED para reintentarla con /sync. Se configura aqui y no en resilience4j.*
    # porque el starter de Spring Cloud CircuitBreaker no lee esas propiedades.
    circuit-breaker:
      sliding-window-size: ${APP_STOCK_CB_SLIDING_WINDOW_SIZE:10}
      minimum-number-of-calls: ${APP_STOCK_CB_MINIMUM_NUMBER_OF_CALLS:5}
      failure-rate-threshold: ${APP_STOCK_CB_FAILURE_RATE_THRESHOLD:50}
      wait-duration-in-open-state: ${APP_STOCK_CB_WAIT_DURATION_IN_OPEN_STATE:30s}
      timeout: ${APP_STOCK_CB_TIMEOUT:10s}
